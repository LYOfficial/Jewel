services:
  jewel:
    build:
      context: .
      args:
        JEWEL_COMMIT: ${JEWEL_COMMIT:-unknown}
        NODE_IMAGE: ${JEWEL_NODE_IMAGE:-node:20-alpine}
    image: jewel:latest
    container_name: jewel
    labels:
      io.jewel.managed: "true"
    ports:
      - "330:330"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jewel-data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - PORT=330
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET before starting Jewel}
      - JEWEL_COMMIT=${JEWEL_COMMIT:-unknown}
    # Git internally forks `git-remote-https` for every HTTPS fetch/pull.
    # The default container PIDs limit can be exhausted during heavy use
    # (rebuild + deploy + periodic checks across many projects), which
    # surfaces as "cannot fork() for remote-https: Resource temporarily
    # unavailable". -1 removes the limit entirely.
    pids_limit: -1
    # docker compose / build can open a lot of files in parallel; the
    # default 1024 nofile cap is too low for that.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

volumes:
  # Pin the volume name explicitly. Without `name:`, Compose v2 prefixes
  # it with the project name (the directory basename), so the volume
  # would silently turn into `<project>_jewel-data` on a fresh deploy and
  # the container would attach to an empty volume — losing all projects
  # and the SQLite DB. Pinning guarantees the same name across renames.
  jewel-data:
    name: jewel-data
