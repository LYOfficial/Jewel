services:
  jewel:
    build:
      context: .
      args:
        JEWEL_COMMIT: ${JEWEL_COMMIT:-latest}
    image: jewel:latest
    container_name: jewel
    ports:
      - "330:330"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jewel-data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - PORT=330
      - JWT_SECRET=change-this-in-production
      - JEWEL_COMMIT=${JEWEL_COMMIT:-latest}
    restart: unless-stopped

volumes:
  jewel-data:
