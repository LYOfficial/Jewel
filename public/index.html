<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewel</title>
  <link rel="icon" type="image/svg+xml" href="/img/jewel.svg">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('jewel-theme') || 'dark';
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/img/jewel.svg" alt="J" class="sidebar-logo">
        <h1>JEWEL</h1>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" href="/dashboard">
          <span class="nav-icon"><img src="/img/icons/dashboard.svg" alt=""></span>
          <span data-i18n="nav.dashboard">仪表盘</span>
        </a>
        <a class="nav-item" data-page="project" href="/project">
          <span class="nav-icon"><img src="/img/icons/projects.svg" alt=""></span>
          <span data-i18n="nav.projects">项目</span>
        </a>
        <a class="nav-item" data-page="containers" href="/containers">
          <span class="nav-icon"><img src="/img/icons/containers.svg" alt=""></span>
          <span data-i18n="nav.containers">容器</span>
        </a>
        <a class="nav-item" data-page="images" href="/images">
          <span class="nav-icon"><img src="/img/icons/images.svg" alt=""></span>
          <span data-i18n="nav.images">镜像</span>
        </a>
        <a class="nav-item" data-page="backups" href="/backups">
          <span class="nav-icon"><img src="/img/icons/backups.svg" alt=""></span>
          <span data-i18n="nav.backups">备份中心</span>
        </a>
        <a class="nav-item" data-page="tokens" href="/tokens">
          <span class="nav-icon"><img src="/img/icons/tokens.svg" alt=""></span>
          <span data-i18n="nav.tokens">Git 令牌</span>
        </a>
        <a class="nav-item" data-page="settings" href="/settings">
          <span class="nav-icon"><img src="/img/icons/settings.svg" alt=""></span>
          <span data-i18n="nav.settings">设置</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="update-banner" id="updateBanner">
          <div class="update-title" data-i18n="update.available">发现新版本</div>
          <div class="update-desc" data-i18n="update.clickToApply">点击更新</div>
        </div>
        <a class="sidebar-github-link" href="https://github.com/LYOfficial/Jewel" target="_blank" rel="noopener noreferrer" aria-label="Jewel on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.71.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.91-2.78.62-3.37-1.21-3.37-1.21-.46-1.21-1.11-1.53-1.11-1.53-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.15-4.56-5.1 0-1.13.39-2.05 1.04-2.77-.1-.26-.45-1.31.1-2.73 0 0 .85-.28 2.75 1.06A9.3 9.3 0 0 1 12 6.87c.85 0 1.7.12 2.5.35 1.9-1.34 2.75-1.06 2.75-1.06.55 1.42.2 2.47.1 2.73.65.72 1.04 1.64 1.04 2.77 0 3.96-2.35 4.83-4.58 5.08.36.32.68.92.68 1.86 0 1.34-.01 2.42-.01 2.75 0 .27.18.6.69.49A10.25 10.25 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"/></svg>
          <span>Jewel</span>
          <span class="sidebar-github-version">v0.2.0</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-context">
          <div class="topbar-kicker">JEWEL WORKSPACE</div>
          <div class="topbar-title" id="pageTitle" data-i18n="nav.dashboard">仪表盘</div>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
            <span class="theme-toggle-icon" aria-hidden="true">☾</span>
          </button>
          <select id="langSelect" aria-label="Language">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
          <div class="user-menu">
            <button class="user-menu-btn" id="userMenuBtn">
              <span class="user-avatar" id="userAvatar" aria-hidden="true">A</span>
              <span id="currentUser">admin</span>
              <span class="user-menu-chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="user-menu-dropdown" id="userMenuDropdown">
              <button class="user-menu-item" id="changePasswordBtn" data-i18n="user.changePassword">修改密码</button>
              <button class="user-menu-item" id="changeUsernameBtn" data-i18n="user.changeUsername">修改用户名</button>
              <button class="user-menu-item" id="logoutBtn" data-i18n="user.logout">退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <div class="content-area" id="contentArea">
        <!-- Dynamic content loaded here -->
      </div>
    </main>
  </div>

  <footer class="app-footer">
    Copyright &copy; 2026 <a href="https://github.com/LYOfficial/Jewel" target="_blank">Jewel</a>
  </footer>

  <!-- Modals -->
  <div id="modalContainer"></div>

  <!-- Notification -->
  <div id="notification" class="notification"></div>

  <!-- Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/notification.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/projects.js"></script>
  <script src="/js/containers.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/backups.js"></script>
  <script src="/js/tokens.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
