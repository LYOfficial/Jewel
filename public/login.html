<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewel - Login</title>
  <link rel="icon" type="image/svg+xml" href="/img/jewel.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-left">
      <div class="login-brand">
        <img src="/img/jewel.svg" alt="Jewel" class="login-logo">
        <h1 class="login-title">Jewel</h1>
        <p class="login-subtitle" data-i18n="login.subtitle">新一代轻量化 Git to Docker 部署工具</p>
      </div>
    </div>
    <div class="login-right">
      <form id="loginForm" class="login-form">
        <h2 data-i18n="login.title">登录</h2>
        <div class="form-group">
          <label data-i18n="login.username">用户名</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label data-i18n="login.password">密码</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="form-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full" data-i18n="login.submit">登录</button>
      </form>
      <div class="login-lang">
        <select id="langSelect">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </div>
  </div>

  <div id="changePasswordModal" class="modal" style="display:none">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h3 data-i18n="login.changePassword">修改密码</h3>
      <p data-i18n="login.mustChangePassword" class="modal-desc">首次登录必须修改密码</p>
      <form id="changePasswordForm">
        <div class="form-group">
          <label data-i18n="login.newPassword">新密码</label>
          <input type="password" id="newPassword" required minlength="6">
        </div>
        <div class="form-group">
          <label data-i18n="login.confirmPassword">确认密码</label>
          <input type="password" id="confirmPassword" required minlength="6">
        </div>
        <div id="changePasswordError" class="form-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full" data-i18n="login.confirm">确认修改</button>
      </form>
    </div>
  </div>

  <div id="changeUsernameModal" class="modal" style="display:none">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h3 data-i18n="login.changeUsername">修改用户名</h3>
      <p data-i18n="login.usernameHint" class="modal-desc">用户名只能包含大小写英文和数字</p>
      <form id="changeUsernameForm">
        <div class="form-group">
          <label data-i18n="login.newUsername">新用户名</label>
          <input type="text" id="newUsername" required pattern="[a-zA-Z0-9]+" minlength="3">
        </div>
        <div id="changeUsernameError" class="form-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full" data-i18n="login.confirm">确认修改</button>
        <button type="button" class="btn btn-secondary btn-full" id="skipUsername" data-i18n="login.skip">跳过</button>
      </form>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
