<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewel - Upgrading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; max-width: 480px; padding: 0 24px; }
    .icon { width: 64px; height: 64px; margin-bottom: 24px; opacity: 0.6; }
    h1 { font-weight: 300; font-size: 24px; letter-spacing: 4px; margin-bottom: 12px; }
    .status-text { color: #999; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .hint { color: #666; font-size: 12px; margin-top: 16px; }
    .spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 2px solid #2a2a2a;
      border-top-color: #f0f0f0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <img src="/img/jewel.svg" alt="Jewel" class="icon">
    <h1>Jewel</h1>
    <p class="status-text">Updating, please wait...<br>Container is being rebuilt and restarted.</p>
    <div class="spinner"></div>
    <p class="hint">This usually takes 1-3 minutes. The page will reload automatically when ready.</p>
  </div>

  <script>
    // Poll until the service is back
    setInterval(() => {
      fetch('/api/system/info').then(r => {
        if (r.ok) window.location.href = '/';
      }).catch(() => {});
    }, 5000);
  </script>
</body>
</html>
